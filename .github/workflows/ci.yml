name: CI

on:
  push:
    branches: [main]
    # Documentation-only changes cannot break the build, so skip the run and
    # save Actions minutes. `paths-ignore` cannot re-include anything, and
    # docs/PACKAGE-README.md is packed as the NuGet README, so the negated
    # `paths` form is used instead: order matters, a positive pattern after a
    # negative one includes the path again.
    paths:
      - '**'
      - '!**/*.md'
      - 'docs/PACKAGE-README.md'
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - 'docs/PACKAGE-README.md'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The version-drift check reads imgui/imgui.h, so the submodules must
          # be present even for a pure managed build.
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore ImGui4NET.slnx

      - name: Build
        run: dotnet build ImGui4NET.slnx -c Release --no-restore

      - name: Pack
        run: dotnet pack ImGui4NET.slnx -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error
